site_name: 3DBAG Labs
site_description: Experimental content, demos, proof of concepts for the 3DBAG.
copyright: 'Copyright © 2026 - 3DBAG by the 3D geoinformation research group and 3DGI. Licensed under CC BY 4.0.'
docs_dir: docs
site_dir: site

theme:
  name: materialx
  custom_dir: overrides
  favicon: assets/images/favicon.ico
  logo: assets/images/logo.svg
  logo2: assets/images/logo-3dgi.svg
  font:
    text: Inter
    code: Roboto Mono
  palette:
    primary: white
    accent: light-blue

plugins: []

hooks:
  - hooks.py

markdown_extensions:
  - attr_list
  - md_in_html

extra_css:
  - assets/stylesheets/extra.css

nav:
  - 3DBAG Labs: index.md
